md_name="ideal_rnemd_exchange"
mode="nve"
pbc=true
dt=0.0001
step_limit=8
cutoff=8
mass_in_file="mass.txt"
charge_in_file="charge.txt"
coordinate_in_file="coordinate.txt"
velocity_in_file="velocity.txt"
write.interval.mdout=2
write.interval.information=2
write.interval.trajectory=1
write.interval.restart=0
PM.MPI_size=1

[sampling]
interval=1
output="viscosity.h5"
profile="slab"
flow="x"
gradient="z"
bins=8

[momentum_exchange]
flow="x"
gradient="z"
bins=8
interval=1
