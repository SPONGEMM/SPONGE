md_name="cosine_projection"
mode="nvt"
pbc=true
dt=0.001
step_limit=10
target_temperature=0.0
cutoff=8.0
mass_in_file="mass.txt"
charge_in_file="charge.txt"
coordinate_in_file="coordinate.txt"
velocity_in_file="velocity.txt"
write.interval.mdout=1
write.interval.information=1
write.interval.trajectory=1
write.interval.restart=0
PM.MPI_size=0
thermostat.mode="middle_langevin"
thermostat.tau=0.002
thermostat.seed=13

[sampling]
interval=1
output="viscosity.h5"
profile="cosine"
flow="x"
gradient="z"
bins=20
mode=1

[velocity_bias]
mode="cosine"
flow="x"
gradient="z"
harmonic=1

[[external_force]]
type="acceleration"
acceleration=[0.0, 0.0, 0.0]
profile={type="cosine", axis="z", mode=1}
