name: Floating-point classification

on:
  pull_request:
    branches: [master, 'lab/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classification:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            compiler: g++
          - runner: ubuntu-24.04
            compiler: clang++
          - runner: windows-2022
            compiler: cl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure strict, fast-math, and LTO tests
        run: >-
          cmake -S tests/floating_point -B build-float
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Compile
        run: cmake --build build-float --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build-float -C Release --output-on-failure
