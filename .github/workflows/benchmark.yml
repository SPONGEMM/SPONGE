name: Andersen macOS long diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: macos-14
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          run-install: false
      - name: Install CPU environment
        run: pixi install -e dev-cpu
      - name: Build unchanged head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/andersen-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/andersen-evidence/diagnostic-commit.txt"
          git diff --exit-code 2fe3373c44b9ee170f1f4b2b6b535c3dcc170c6b HEAD -- SPONGE CMakeLists.txt cmake > "$RUNNER_TEMP/andersen-evidence/production-parity.diff"
          pixi run -e dev-cpu configure
          pixi run -e dev-cpu cmake --build build-dev-cpu --target SPONGE --parallel 2
      - name: Run predeclared paired and timestep diagnostics
        run: >-
          pixi run -e dev-cpu python benchmarks/diagnostics/andersen_temperature.py
          --source "$GITHUB_WORKSPACE"
          --head-binary "$GITHUB_WORKSPACE/build-dev-cpu/SPONGE"
          --output "$RUNNER_TEMP/andersen-evidence/cases"
          --plan mac-long
      - name: Upload all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andersen-macos-long-${{ github.run_id }}
          path: ${{ runner.temp }}/andersen-evidence
          retention-days: 14
